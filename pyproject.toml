[project]
name = "academic-timetabling-demo"
version = "0.1.0"
description = "Demo local de programación académica con datos sintéticos"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jinja2",
    "ortools",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
